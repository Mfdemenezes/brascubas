<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz — Memórias Póstumas de Brás Cubas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #CEBA9F;
    --ink: #000000;
    --paper: #DCCBB2;
    --line: #000000;
    --ok: #1E5B2C;
    --ok-bg: #B9C9A4;
    --bad: #8A1C1C;
    --bad-bg: #D9A898;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #CEBA9F; --ink: #000000; }
  }
  :root[data-theme="dark"] { --bg: #CEBA9F; --ink: #000000; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "EB Garamond", Garamond, "Times New Roman", Georgia, serif;
    font-size: 1.2rem; line-height: 1.5;
  }
  main { max-width: 38rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }

  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 2rem; }
  h1 { font-size: 1.9rem; line-height: 1.15; font-weight: 500; margin: 0; }
  h1 em { display: block; font-size: 1.05rem; font-style: italic; font-weight: 400; margin-top: .35rem; }

  .reset {
    flex-shrink: 0; font: inherit; font-size: 1rem;
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--ink); border-radius: 999px;
    padding: .45rem 1rem; cursor: pointer;
  }
  @media (hover: hover) { .reset:hover { background: var(--ink); color: var(--bg); } }
  .reset:active { background: var(--ink); color: var(--bg); }

  .progress { font-style: italic; margin: 0 0 .5rem; }
  .bar { height: 3px; background: rgba(0,0,0,.18); margin-bottom: 1.75rem; }
  .bar span { display: block; height: 100%; background: var(--ink); transition: width .3s; }

  h2 { font-size: 1.55rem; line-height: 1.25; font-weight: 500; margin: 0 0 1.5rem; }

  .options { list-style: none; margin: 0; padding: 0; display: grid; gap: .7rem; }
  .opt {
    width: 100%; text-align: left; font: inherit; color: var(--ink);
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 4px;
    padding: .8rem 1rem; cursor: pointer; display: flex; gap: .75rem; align-items: baseline;
  }
  @media (hover: hover) { .opt:hover:not(:disabled) { background: #E6D8C3; } }
  button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .opt:disabled { cursor: default; }
  .opt b { font-weight: 700; min-width: 1.2em; }
  .opt.correct { background: var(--ok-bg); border-color: var(--ok); border-width: 2.5px; }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad); border-width: 2.5px; }
  .opt.dim { opacity: .55; }

  .feedback { margin: 1.5rem 0 0; font-size: 1.35rem; font-weight: 700; min-height: 2rem; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }

  .next {
    margin-top: 1rem; font: inherit; font-weight: 500;
    background: var(--ink); color: var(--bg); border: none; border-radius: 4px;
    padding: .75rem 1.6rem; cursor: pointer;
  }
  .next[hidden] { display: none; }

  .result { text-align: center; padding-top: 1rem; }
  .score { font-size: 6rem; line-height: 1; font-weight: 500; margin: .5rem 0; }
  .score small { font-size: 2.2rem; }
  .result p { margin: .5rem 0 2rem; font-size: 1.3rem; }
  .result .next { font-size: 1.2rem; }

  .cover { text-align: center; padding-top: 1.5rem; }
  .cover svg { width: min(15rem, 70%); height: auto; display: block; margin: 0 auto 1.5rem; }
  .cover .kicker { font-style: italic; font-size: 1.15rem; margin: 0; }
  .cover h1.big { font-size: clamp(2.2rem, 8vw, 3.2rem); line-height: 1.05; font-weight: 500; margin: .4rem 0 .6rem; }
  .cover .author { font-size: 1.3rem; margin: 0 0 1.75rem; letter-spacing: .02em; }
  .cover blockquote {
    font-style: italic; font-size: 1.1rem; max-width: 26rem; margin: 0 auto 2rem;
    border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); padding: .9rem .5rem;
  }
  .cover blockquote cite { display: block; font-style: normal; font-size: .95rem; margin-top: .4rem; }
  .cover .next { font-size: 1.25rem; padding: .85rem 2.4rem; }

  .player { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; max-width: 26rem; margin: 0 auto 1rem; text-align: left; }
  .player label { font-size: .95rem; font-style: italic; display: grid; gap: .2rem; }
  .player input {
    font: inherit; font-size: 1.1rem; color: var(--ink); background: var(--paper);
    border: 1.5px solid var(--ink); border-radius: 4px; padding: .55rem .7rem; width: 100%;
  }
  .player input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .next:disabled { opacity: .4; cursor: not-allowed; }
  .ranking { max-width: 26rem; margin: 2.5rem auto 0; text-align: left; }
  .ranking h3 { font-size: 1.4rem; font-weight: 500; text-align: center; margin: 0 0 .75rem; }
  .ranking ol { list-style: none; margin: 0; padding: 0; border-top: 1.5px solid var(--ink); }
  .ranking li { display: grid; grid-template-columns: 2.2rem 1fr auto auto; gap: .6rem; align-items: baseline;
    padding: .45rem .25rem; border-bottom: 1px solid rgba(0,0,0,.35); }
  .ranking li.me { background: var(--paper); font-weight: 700; }
  .ranking .pos { font-weight: 700; }
  .ranking .nm { overflow-wrap: anywhere; }
  .ranking .tm { font-size: .9rem; font-style: italic; }
  .ranking .empty, .ranking .note { text-align: center; font-style: italic; font-size: 1rem; margin: .6rem 0 0; }
  .clear {
    display: block; margin: 1.5rem auto 0; font: inherit; font-size: .85rem; font-style: italic;
    background: transparent; color: var(--ink); border: 1px solid rgba(0,0,0,.45); border-radius: 999px;
    padding: .25rem .8rem; cursor: pointer; opacity: .7;
  }
  .clear.armed { opacity: 1; background: var(--bad); color: #fff; border-color: var(--bad); font-style: normal; }
  .clear:disabled { cursor: wait; }
  @media (max-width: 480px) { .player { grid-template-columns: 1fr; } }

  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
  @media (max-width: 480px) {
    header { flex-direction: column; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.35rem; }
  }
</style>
</head>
<body>
<main>
  <header id="top">
    <h1>Quiz<em>Memórias Póstumas de Brás Cubas</em></h1>
    <button class="reset" id="reset" type="button">↻ Recomeçar</button>
  </header>
  <section id="app" aria-live="polite"></section>
</main>

<script>
const QUESTIONS = [
  { q: "Quem é o autor de Memórias Póstumas de Brás Cubas?",
    o: ["José de Alencar", "Aluísio Azevedo", "Machado de Assis", "Raul Pompeia"], a: 2 },
  { q: "Por que Brás Cubas é chamado de “defunto autor”?",
    o: ["Porque escreve sobre a morte de seus familiares.",
        "Porque narra sua própria vida depois de morrer.",
        "Porque escreve um livro sobre pessoas mortas.",
        "Porque sua história começa durante seu funeral."], a: 1 },
  { q: "Qual era um dos objetivos de Brás Cubas ao criar o Emplasto?",
    o: ["Ajudar Virgília a superar uma doença.",
        "Conquistar reconhecimento e deixar seu nome famoso.",
        "Melhorar sua situação financeira por meio da venda do produto.",
        "Criar uma cura para todas as doenças da sociedade."], a: 1 },
  { q: "Qual destes temas é criticado por Machado de Assis em Memórias Póstumas de Brás Cubas?",
    o: ["A valorização da natureza e da vida no campo.",
        "A busca pela liberdade e pela aventura.",
        "A importância da religião na sociedade.",
        "O egoísmo e a vaidade presentes na sociedade."], a: 3 },
  { q: "Por que Brás Cubas considera que teve uma espécie de vitória no final da obra?",
    o: ["Porque conseguiu realizar seu maior sonho e criar o Emplasto.",
        "Porque conquistou fama e reconhecimento durante sua vida.",
        "Porque não teve filhos e não transmitiu a eles o sofrimento da existência.",
        "Porque conseguiu se casar com Virgília e formar uma família."], a: 2 }
];
const LETTERS = ["A", "B", "C", "D"];
const app = document.getElementById("app");
let order = [], idx = 0, hits = 0, lastOrder = "", player = "", startedAt = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  // embaralha e garante que a ordem seja diferente da anterior
  let o;
  do { o = shuffle(QUESTIONS.map((_, i) => i)); } while (o.join() === lastOrder);
  lastOrder = o.join();
  order = o; idx = 0; hits = 0; startedAt = Date.now();
  renderQuestion();
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const item = QUESTIONS[order[idx]];
  const total = order.length;
  app.innerHTML = `
    <p class="progress">Pergunta ${idx + 1} de ${total}</p>
    <div class="bar"><span style="width:${(idx / total) * 100}%"></span></div>
    <h2>${item.q}</h2>
    <ul class="options">
      ${item.o.map((t, i) => `<li><button class="opt" type="button" data-i="${i}"><b>${LETTERS[i]})</b><span>${t}</span></button></li>`).join("")}
    </ul>
    <p class="feedback" id="fb"></p>
    <button class="next" id="next" type="button" hidden>${idx + 1 < total ? "Próxima pergunta" : "Ver resultado"}</button>
  `;
  app.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => answer(btn, item)));
  document.getElementById("next").addEventListener("click", () => {
    idx++;
    idx < order.length ? renderQuestion() : renderResult();
  });
}

function answer(btn, item) {
  const chosen = Number(btn.dataset.i);
  const buttons = app.querySelectorAll(".opt");
  buttons.forEach(b => {
    b.disabled = true;
    const i = Number(b.dataset.i);
    if (i === item.a) b.classList.add("correct");
    else if (i === chosen) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const fb = document.getElementById("fb");
  if (chosen === item.a) {
    hits++;
    fb.textContent = "✔ Correta!";
    fb.className = "feedback ok";
  } else {
    fb.textContent = `✘ Errada. A resposta certa é a ${LETTERS[item.a]}.`;
    fb.className = "feedback bad";
  }
  const next = document.getElementById("next");
  next.hidden = false;
  next.focus();
}

function renderResult() {
  const total = order.length;
  let msg = "Precisa reler o livro!";
  if (hits === total) msg = "Perfeito, acertou todas!";
  else if (hits >= total - 1) msg = "Muito bem!";
  else if (hits >= Math.ceil(total / 2)) msg = "Bom resultado.";
  app.innerHTML = `
    <div class="bar"><span style="width:100%"></span></div>
    <div class="result">
      <p style="margin:0;font-style:italic">${esc(player)}, você acertou</p>
      <div class="score">${hits}<small> / ${total}</small></div>
      <p>${msg}</p>
      <button class="next" id="again" type="button">↻ Próxima pessoa</button>
      <div class="ranking" id="rank"></div>
    </div>
  `;
  const entry = { nome: player, acertos: hits, total, tempoMs: Date.now() - startedAt, quando: new Date().toISOString() };
  saveScore(entry).then(id => renderRanking(document.getElementById("rank"), id));
  document.getElementById("again").addEventListener("click", renderCover);
}


/* ===== Ranking: banco compartilhado quando publicado; localStorage no arquivo baixado ===== */
// URL do App da Web do Google Apps Script (termina em /exec). Deixe vazio para salvar só no aparelho.
const SHEET_API = "https://script.google.com/macros/s/AKfycbxsTzoxqHhjlqvhktHJf1EWdTU7T8lCgUzQovAMZdBkB4KuQO6FjIB0cPRl_afslV-AcQ/exec";

const LS_KEY = "quiz-bras-cubas-ranking";
let scores = [];              // todos os resultados
let dbRef = null;             // coleção no banco (se disponível)
let lastSavedId = null;

function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function cap(t) { return t.trim().replace(/\s+/g, " ").toLowerCase().replace(/(^|\s)(\S)/g, (m, a, b) => a + b.toUpperCase()); }
function fmtTime(ms) { const s = Math.round(ms / 1000); return s < 60 ? s + "s" : Math.floor(s / 60) + "min " + (s % 60) + "s"; }
function sortScores(list) { return list.slice().sort((a, b) => b.acertos - a.acertos || a.tempoMs - b.tempoMs); }

function loadLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { return []; } }
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(scores)); } catch {} }

scores = loadLocal();

async function sheetCall(body) {
  const params = new URLSearchParams({ t: Date.now() });
  if (body) {
    params.set("action", body.action || "add");
    ["cid", "nome", "acertos", "total", "tempoMs"].forEach(k => { if (body[k] !== undefined) params.set(k, body[k]); });
  }
  const r = await fetch(SHEET_API + "?" + params.toString(), { redirect: "follow" });
  const j = await r.json();
  if (!j.ok) throw new Error(j.erro || "falha");
  return j;
}
let sheetOk = false;
// Resultados que não chegaram na planilha (Wi-Fi caiu): ficam aqui e são reenviados no próximo sync.
const PENDING_KEY = "quiz-bras-cubas-pendentes";
function loadPending() { try { return JSON.parse(localStorage.getItem(PENDING_KEY) || "[]"); } catch { return []; } }
function savePending(list) { try { localStorage.setItem(PENDING_KEY, JSON.stringify(list)); } catch {} }
function withPending(list) {
  const ids = new Set(list.map(x => x.id));
  return list.concat(loadPending().filter(x => !ids.has(x.cid)).map(x => ({ ...x, id: x.cid })));
}
let flushing = false;
async function flushPending() {
  if (flushing) return;
  flushing = true;
  try {
    for (const x of loadPending()) {
      await sheetCall(x);  // cid evita duplicar se um envio anterior chegou e só a resposta se perdeu
      savePending(loadPending().filter(y => y.cid !== x.cid));
    }
  } finally { flushing = false; }
}
async function syncSheet() {
  if (!SHEET_API) return;
  try { await flushPending(); } catch {}
  try { const j = await sheetCall(); scores = withPending(j.scores); sheetOk = true; refreshVisibleRanking(); }
  catch { sheetOk = false; }
}

async function saveScore(entry) {
  if (SHEET_API) {
    entry = { ...entry, cid: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)) };
    try {
      const j = await sheetCall(entry);
      scores = withPending(j.scores); sheetOk = true;
      return j.id;
    } catch (e) {
      savePending(loadPending().concat(entry));
      scores = withPending(scores);
      const el = document.getElementById("rank");
      if (el) el.insertAdjacentHTML("beforebegin", `<p class="note" style="color:var(--bad)">⚠ Sem conexão com a planilha. O resultado ficou guardado e será enviado automaticamente.</p>`);
      return entry.cid;
    }
  }
  if (dbRef) {
    try {
      const ref = await dbRef.add(entry);
      lastSavedId = ref.id;
      if (!scores.some(x => x.id === ref.id)) scores.push({ ...entry, id: ref.id });
      return ref.id;
    } catch (e) { /* cai para o armazenamento local */ }
  }
  const id = "l" + Date.now();
  scores.push({ ...entry, id });
  saveLocal();
  return id;
}

function renderRanking(el, highlightId) {
  if (!el) return;
  el.dataset.hl = highlightId || "";
  const top = sortScores(scores).slice(0, 10);
  const myPos = highlightId ? sortScores(scores).findIndex(x => x.id === highlightId) + 1 : 0;
  el.innerHTML = `<h3>🏆 Top 10</h3>` + (top.length
    ? `<ol>${top.map((x, i) => `<li class="${x.id === highlightId ? "me" : ""}">
        <span class="pos">${i + 1}º</span><span class="nm">${esc(x.nome)}</span>
        <span>${x.acertos}/${x.total}</span><span class="tm">${fmtTime(x.tempoMs)}</span></li>`).join("")}</ol>`
    : `<p class="empty">Ainda ninguém jogou. Seja o primeiro!</p>`)
    + (myPos > 10 ? `<p class="note">Você ficou em ${myPos}º lugar de ${scores.length}.</p>` : "")
    + `<p class="note">${scores.length} ${scores.length === 1 ? "quiz feito" : "quizzes feitos"} · desempate pelo menor tempo</p>`;
}

function setupClear(btn) {
  let timer = null;
  btn.addEventListener("click", async () => {
    if (!btn.classList.contains("armed")) {
      btn.classList.add("armed");
      btn.textContent = "Toque de novo para apagar tudo";
      timer = setTimeout(() => { btn.classList.remove("armed"); btn.textContent = "Limpar ranking"; }, 4000);
      return;
    }
    clearTimeout(timer);
    btn.disabled = true;
    btn.textContent = "Apagando…";
    let falhou = false;
    if (SHEET_API) {
      try { await sheetCall({ action: "clear" }); } catch { falhou = true; }
    } else if (dbRef) {
      for (const x of scores) {
        try { await dbRef.doc(x.id).delete(); } catch { falhou = true; }
      }
    }
    scores = falhou ? scores : [];
    try { localStorage.removeItem(LS_KEY); } catch {}
    refreshVisibleRanking();
    btn.disabled = false;
    btn.classList.remove("armed");
    btn.textContent = falhou ? "Não foi possível apagar tudo" : "Ranking limpo ✓";
    setTimeout(() => { btn.textContent = "Limpar ranking"; }, 2500);
  });
}

function refreshVisibleRanking() {
  const el = document.getElementById("rank");
  if (el) renderRanking(el, el.dataset.hl || null);
}

if (SHEET_API) {
  syncSheet();
  setInterval(() => { if (!document.hidden && (document.getElementById("rank") || loadPending().length)) syncSheet(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncSheet(); });
}

(async () => {
  if (SHEET_API || !window.claude || !window.claude.use) return;
  const db = await window.claude.use("db");
  if (!db) return;
  dbRef = db.collection("scores");
  dbRef.limit(1000).onSnapshot(snap => {
    scores = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    refreshVisibleRanking();
  }, () => { dbRef = null; });
})();

const COVER_ART = `
<svg viewBox="0 0 240 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- lápide -->
  <path d="M40 240 V110 Q40 40 120 40 Q200 40 200 110 V240 Z" fill="#DCCBB2"/>
  <path d="M52 240 V112 Q52 54 120 54 Q188 54 188 112 V240" stroke-width="1"/>
  <line x1="20" y1="240" x2="220" y2="240" stroke-width="3"/>
  <path d="M28 240 q10 -12 20 0 M190 240 q12 -14 22 0" stroke-width="1.5"/>
  <!-- inscrição -->
  <text x="120" y="98" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="17" fill="#000" stroke="none">Brás Cubas</text>
  <text x="120" y="120" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="12" font-style="italic" fill="#000" stroke="none">defunto autor</text>
  <line x1="92" y1="132" x2="148" y2="132" stroke-width="1"/>
  <!-- pena -->
  <path d="M168 150 C150 170 120 196 96 222" stroke-width="1.6"/>
  <path d="M168 150 C182 136 196 128 204 126 C200 140 186 160 170 172 C150 188 126 204 104 214 C122 196 148 172 168 150 Z" fill="#DCCBB2"/>
  <path d="M176 150 l12 -2 M170 160 l14 -2 M160 172 l14 -1 M148 184 l12 0" stroke-width="1"/>
  <!-- tinteiro -->
  <path d="M70 222 h40 v-18 q0 -10 -10 -10 h-20 q-10 0 -10 10 Z" fill="#000"/>
  <rect x="80" y="186" width="20" height="8" fill="#000"/>
</svg>`;

function renderCover() {
  document.getElementById("top").style.display = "none";
  app.innerHTML = `
    <div class="cover">
      ${COVER_ART}
      <p class="kicker">Quiz sobre</p>
      <h1 class="big">Memórias Póstumas de Brás Cubas</h1>
      <p class="author">Machado de Assis · 1881</p>
      <blockquote>
        Ao verme que primeiro roeu as frias carnes do meu cadáver dedico como saudosa lembrança estas memórias póstumas.
        <cite>— dedicatória do livro</cite>
      </blockquote>
      <div class="player">
        <label>Nome<input id="fn" autocomplete="off" autocapitalize="words" maxlength="30"></label>
        <label>Sobrenome<input id="ln" autocomplete="off" autocapitalize="words" maxlength="40"></label>
      </div>
      <button class="next" id="go" type="button" disabled>Começar</button>
      <div class="ranking" id="rank"></div>
      <button class="clear" id="clear" type="button">Limpar ranking</button>
    </div>`;
  setupClear(document.getElementById("clear"));
  const fn = document.getElementById("fn"), ln = document.getElementById("ln"), go = document.getElementById("go");
  const check = () => { go.disabled = !(fn.value.trim() && ln.value.trim()); };
  fn.addEventListener("input", check); ln.addEventListener("input", check);
  [fn, ln].forEach(el => el.addEventListener("keydown", e => { if (e.key === "Enter" && !go.disabled) go.click(); }));
  go.addEventListener("click", () => {
    player = cap(fn.value) + " " + cap(ln.value);
    document.getElementById("top").style.display = "";
    start();
  });
  renderRanking(document.getElementById("rank"), null);
  window.scrollTo(0, 0);
}

document.getElementById("reset").addEventListener("click", renderCover);
renderCover();

/* ===== Auto-atualização: sempre a última versão no endereço limpo ===== */
// Troque APP_VERSION a cada publicação: os aparelhos abertos recarregam sozinhos quando estiverem na capa.
const APP_VERSION = "2026-09-24.1";
if (location.search) history.replaceState(null, "", location.pathname);  // some com ?v=3 etc.
async function checkUpdate() {
  try {
    const html = await (await fetch(location.pathname + "?t=" + Date.now(), { cache: "no-store" })).text();
    const m = html.match(/const APP_VERSION = "([^"]+)"/);
    const naCapa = document.querySelector(".cover") && !document.getElementById("fn").value && !document.getElementById("ln").value;
    if (m && m[1] !== APP_VERSION && naCapa) location.replace(location.pathname + "?t=" + Date.now());
  } catch {}
}
setInterval(() => { if (!document.hidden) checkUpdate(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(); });
checkUpdate();
</script>
</body>
</html>
